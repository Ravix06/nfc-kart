<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siparişlerim - NFC KART CNR</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#121316] text-slate-100 flex flex-col min-h-screen font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Top Floating Navbar -->
    <div class="sticky top-4 z-50 px-4 flex justify-center w-full">
        <nav class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-full px-5 sm:px-7 py-2.5 flex items-center justify-between shadow-2xl max-w-4xl w-full">
            <a href="/" class="flex items-center space-x-2.5 shrink-0">
                <img src="/img/logo.jpg" alt="NFC KART CNR Logo" class="w-8 h-8 rounded-xl object-cover border border-indigo-500/40 shadow-lg shadow-indigo-500/20">
                <span class="font-extrabold text-sm sm:text-base tracking-tight text-white">NFC KART CNR</span>
            </a>

            <div class="flex items-center space-x-3 text-xs">
                <a href="/" class="text-slate-400 hover:text-white transition font-medium">← Ana Sayfa</a>
                <a href="/admin" class="text-slate-400 hover:text-amber-400 font-bold transition flex items-center space-x-1">
                    <i class="fa-solid fa-key text-amber-400"></i>
                    <span>Admin</span>
                </a>
                <a href="/order" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3.5 py-1.5 rounded-full text-xs transition">
                    + Yeni Sipariş
                </a>
            </div>
        </nav>
    </div>

    <!-- Main Container -->
    <main class="flex-grow max-w-4xl mx-auto px-4 py-12 w-full">
        
        <!-- Toast Alert Container -->
        <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2"></div>

        <!-- AUTH MODAL / LOGIN CONTAINER (Giriş Yapılmamışsa) -->
        <div id="auth-section" class="max-w-md mx-auto space-y-6">
            <div class="glass-card p-8 rounded-3xl border border-slate-800 text-center space-y-5 shadow-2xl">
                <div class="w-16 h-16 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center mx-auto text-3xl">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-white">Siparişlerimi Görüntüle</h1>
                    <p class="text-xs text-slate-400 mt-1">Sipariş verirken girdiğiniz telefon numaranızla giriş yapın.</p>
                </div>

                <form onsubmit="handleCustomerLogin(event)" class="space-y-4 text-left pt-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Telefon Numarası *</label>
                        <div class="flex items-center bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-sm text-white focus-within:border-indigo-500">
                            <i class="fa-solid fa-phone text-slate-500 mr-2 text-xs"></i>
                            <input type="tel" id="cust-phone-input" required placeholder="0532 123 45 67" class="bg-transparent w-full text-white focus:outline-none text-sm">
                        </div>
                    </div>

                    <button type="submit" id="btn-login-submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-3.5 rounded-xl shadow-lg shadow-indigo-600/20 transition flex items-center justify-center space-x-2 text-sm">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>Siparişlerimi Getir</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- ORDERS LIST CONTAINER (Giriş Yapılmışsa) -->
        <div id="orders-section" class="hidden space-y-6">
            
            <!-- User Session Header -->
            <div class="glass-card p-6 rounded-3xl border border-slate-800 flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg font-bold">
                        <i class="fa-solid fa-user-check"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400 font-medium">Giriş Yapılan Telefon</div>
                        <div id="logged-phone-display" class="text-base font-extrabold text-white font-mono">0532 000 00 00</div>
                    </div>
                </div>

                <button onclick="handleLogout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl border border-slate-700 transition font-bold flex items-center space-x-1.5">
                    <i class="fa-solid fa-arrow-right-from-bracket text-rose-400"></i>
                    <span>Çıkış Yap</span>
                </button>
            </div>

            <!-- Orders Header -->
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h2 class="text-lg font-black text-white flex items-center gap-2">
                    <span>Sipariş Geçmişiniz</span>
                    <span id="orders-count-badge" class="bg-indigo-600/30 text-indigo-300 text-xs px-2.5 py-0.5 rounded-full border border-indigo-500/30">0</span>
                </h2>
                <button onclick="loadCustomerOrders()" class="text-xs text-indigo-400 hover:underline flex items-center gap-1 font-semibold">
                    <i class="fa-solid fa-rotate-right"></i> Yenile
                </button>
            </div>

            <!-- Orders List Cards -->
            <div id="orders-list" class="space-y-4">
                <!-- Dynamically Rendered -->
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 py-8 text-center text-slate-500 text-xs bg-slate-950 mt-auto">
        <p>© 2026 NFC KART CNR - Tüm Hakları Saklıdır.</p>
    </footer>

    <!-- Script -->
    <script>
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-rose-900/90 border-rose-700 text-white' : type === 'success' ? 'bg-emerald-900/90 border-emerald-700 text-white' : 'bg-slate-900/90 border-slate-700 text-white';
            toast.className = `${bgClass} border backdrop-blur-md px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold flex items-center space-x-2 animate-bounce`;
            toast.innerHTML = `<span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedPhone = localStorage.getItem('customer_phone');
            if (savedPhone) {
                document.getElementById('cust-phone-input').value = savedPhone;
                loadCustomerOrders(savedPhone);
            }
        });

        async function handleCustomerLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('cust-phone-input').value.trim();
            if (!phone) return;

            localStorage.setItem('customer_phone', phone);
            await loadCustomerOrders(phone);
        }

        async function loadCustomerOrders(phoneOverride) {
            const phone = phoneOverride || localStorage.getItem('customer_phone');
            if (!phone) return;

            const btn = document.getElementById('btn-login-submit');
            if (btn) btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> <span>Yükleniyor...</span>';

            try {
                const res = await fetch('/api/customer/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Siparişler alınamadı.');

                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('orders-section').classList.remove('hidden');
                document.getElementById('logged-phone-display').innerText = phone;
                document.getElementById('orders-count-badge').innerText = data.orders.length;

                renderOrders(data.orders);
            } catch (err) {
                showToast(err.message, 'error');
                if (btn) btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> <span>Siparişlerimi Getir</span>';
            }
        }

        function renderOrders(orders) {
            const listEl = document.getElementById('orders-list');
            if (orders.length === 0) {
                listEl.innerHTML = `
                    <div class="glass-card p-12 rounded-3xl border border-slate-800 text-center space-y-3">
                        <div class="text-4xl">📭</div>
                        <h3 class="text-base font-bold text-white">Henüz Kayıtlı Siparişiniz Bulunmuyor</h3>
                        <p class="text-xs text-slate-400">Bu telefon numarasıyla verilmiş bir sipariş bulunamadı.</p>
                        <a href="/order" class="inline-block mt-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs">
                            + İlk Siparişini Oluştur
                        </a>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = orders.map(ord => {
                const isApproved = ord.status && (ord.status.includes('Onaylandı') || ord.status.includes('Aktif'));
                const isKapida = ord.paymentMethod && ord.paymentMethod.includes('Kapıda');

                let statusBadge = '';
                if (isApproved) {
                    statusBadge = `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-circle-check"></i> Ödeme Onaylandı & Aktif</span>`;
                } else if (isKapida) {
                    statusBadge = `<span class="bg-sky-500/20 text-sky-400 border border-sky-500/40 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-truck-fast"></i> Sipariş Alındı (Kapıda Ödeme)</span>`;
                } else {
                    statusBadge = `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/40 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 animate-pulse"><i class="fa-solid fa-clock"></i> Ödeme Bekleniyor</span>`;
                }

                const createdDateStr = ord.createdAt ? new Date(ord.createdAt).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Bugün';

                return `
                    <div class="glass-card p-6 sm:p-7 rounded-3xl border border-slate-800 space-y-4 relative hover:border-slate-700 transition">
                        
                        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800/80 pb-4">
                            <div>
                                <div class="text-xs text-slate-500 font-mono font-semibold">SİPARİŞ NO: #${ord.id}</div>
                                <h3 class="text-lg font-extrabold text-white mt-0.5">${ord.customerName}</h3>
                                <div class="text-xs text-slate-400">${createdDateStr}</div>
                            </div>
                            <div>
                                ${statusBadge}
                            </div>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 bg-slate-950/80 p-4 rounded-2xl border border-slate-800 text-xs">
                            <div>
                                <span class="text-slate-500 block text-[11px]">Adet:</span>
                                <span class="font-extrabold text-white">${ord.quantity || 1} Adet</span>
                            </div>
                            <div>
                                <span class="text-slate-500 block text-[11px]">Kart Modeli:</span>
                                <span class="font-bold text-slate-300">${ord.cardColor || 'Gümüş Metal'}</span>
                            </div>
                            <div>
                                <span class="text-slate-500 block text-[11px]">Ödeme Tipi:</span>
                                <span class="font-bold text-slate-300">${ord.paymentMethod || 'IBAN'}</span>
                            </div>
                            <div>
                                <span class="text-slate-500 block text-[11px]">Toplam Tutar:</span>
                                <span class="font-extrabold text-emerald-400 text-sm">${ord.totalPrice || ord.price || '1.000 TL'}</span>
                            </div>
                        </div>

                        <!-- Action Button -->
                        <div class="flex items-center justify-between pt-1">
                            <div class="text-xs text-slate-400">
                                <i class="fa-solid fa-location-dot text-indigo-400 mr-1"></i> ${ord.city || ''} / ${ord.district || ''}
                            </div>

                            ${isApproved ? `
                                <a href="/p/${ord.profileId}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black px-4 py-2 rounded-xl text-xs flex items-center space-x-1.5 shadow-lg shadow-emerald-500/20 transition">
                                    <span>Kart Profilini Gör</span>
                                    <span>↗</span>
                                </a>
                            ` : `
                                <a href="/order?status=${ord.profileId}" class="bg-indigo-600/30 hover:bg-indigo-600 text-indigo-300 hover:text-white px-4 py-2 rounded-xl text-xs font-bold border border-indigo-500/30 transition flex items-center space-x-1">
                                    <span>Ödeme & Canlı Durum</span>
                                    <span>→</span>
                                </a>
                            `}
                        </div>

                    </div>
                `;
            }).join('');
        }

        function handleLogout() {
            localStorage.removeItem('customer_phone');
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('orders-section').classList.add('hidden');
            document.getElementById('cust-phone-input').value = '';
            showToast("Oturum kapatıldı.", "info");
        }
    </script>
</body>
</html>
